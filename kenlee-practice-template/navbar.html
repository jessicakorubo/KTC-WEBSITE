<script>
(function () {
    function initNavbar() {
        var ham      = document.getElementById('hamburger');
        var collapse = document.getElementById('navbarCollapse');
        var dropdown = document.getElementById('findout-dropdown');
        var ddToggle = dropdown ? dropdown.querySelector('.dropdown-toggle') : null;

        if (!ham || !collapse) return;

        /* Hamburger open/close */
        ham.addEventListener('click', function () {
            var isOpen = collapse.classList.toggle('open');
            ham.classList.toggle('open', isOpen);
            ham.setAttribute('aria-expanded', isOpen);
        });

        /* Mobile dropdown toggle */
        if (ddToggle) {
            ddToggle.addEventListener('click', function (e) {
                if (window.innerWidth <= 992) {
                    e.preventDefault();
                    dropdown.classList.toggle('open');
                    this.setAttribute('aria-expanded', dropdown.classList.contains('open'));
                }
            });
        }

        /* Close on outside click */
        document.addEventListener('click', function (e) {
            if (window.innerWidth <= 992 &&
                !collapse.contains(e.target) &&
                !ham.contains(e.target)) {
                collapse.classList.remove('open');
                ham.classList.remove('open');
                ham.setAttribute('aria-expanded', 'false');
                if (dropdown) dropdown.classList.remove('open');
            }
        });

        /* Active link highlight */
        var currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-link, .dropdown-item').forEach(function (link) {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            }
        });
    }

    /* Run after DOM is ready — works whether loaded statically or via fetch() */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNavbar);
    } else {
        initNavbar();
    }
})();
</script>
